# Rebuilds the Falci daily horoscope pages once a day so the static HTML carries the current date.
# No paid API: node araclar/build.js only. Commits only the horoscope folders.
name: gunluk-burc
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: gunluk-burc
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node araclar/test.js && node araclar/build.js
      - run: |
          git add en/daily-horoscope ar/abraj-alyawm
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Daily horoscope $(date -u +%F)"
          git push
